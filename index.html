<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ChurchNotes</title>

<style>

/* =========================
   RESET
========================= */
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
    font-family:Arial, Helvetica, sans-serif;
}

/* =========================
   BODY
========================= */
body{
    min-height:100vh;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#ffffff;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(59,130,246,.35) 0%,
            rgba(30,64,175,.18) 28%,
            transparent 55%
        ),
        linear-gradient(
            145deg,
            #020617 0%,
            #0f172a 35%,
            #172554 68%,
            #2563eb 100%
        );
}

/* =========================
   SPLASH CONTAINER
========================= */
.splash{
    width:min(430px,100%);
    min-height:100vh;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:35px 24px;

    position:relative;

    overflow:hidden;
}

/* =========================
   BACKGROUND GLOW
========================= */
.glow{
    position:absolute;

    width:330px;
    height:330px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(96,165,250,.30) 0%,
            rgba(59,130,246,.15) 35%,
            transparent 70%
        );

    filter:blur(5px);

    top:12%;
    left:50%;

    transform:translateX(-50%);

    animation:glowPulse 3s ease-in-out infinite;

    pointer-events:none;
}

/* additional background circles */
.splash::before,
.splash::after{
    content:"";

    position:absolute;

    border-radius:50%;

    pointer-events:none;
}

.splash::before{
    width:180px;
    height:180px;

    right:-80px;
    top:10%;

    background:rgba(37,99,235,.12);

    filter:blur(2px);
}

.splash::after{
    width:220px;
    height:220px;

    left:-120px;
    bottom:5%;

    background:rgba(59,130,246,.10);

    filter:blur(3px);
}

/* =========================
   LOGO
========================= */
.logo{
    position:relative;

    width:118px;
    height:118px;

    border-radius:34px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:27px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.20),
            rgba(255,255,255,.07)
        );

    border:1px solid rgba(255,255,255,.30);

    box-shadow:
        0 25px 60px rgba(0,0,0,.40),
        inset 0 1px 0 rgba(255,255,255,.20);

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    animation:
        logoFloat 3s ease-in-out infinite,
        logoAppear .8s ease forwards;

    z-index:2;
}

/* logo shine */
.logo::before{
    content:"";

    position:absolute;

    width:55px;
    height:55px;

    top:-15px;
    right:-10px;

    border-radius:50%;

    background:rgba(255,255,255,.10);

    filter:blur(10px);
}

/* =========================
   CROSS
========================= */
.cross{
    position:relative;

    width:46px;
    height:64px;

    filter:
        drop-shadow(
            0 5px 12px rgba(255,255,255,.20)
        );
}

.cross::before{
    content:"";

    position:absolute;

    width:14px;
    height:64px;

    border-radius:8px;

    background:#ffffff;

    left:16px;
    top:0;
}

.cross::after{
    content:"";

    position:absolute;

    width:46px;
    height:14px;

    border-radius:8px;

    background:#ffffff;

    left:0;
    top:17px;
}

/* =========================
   BRAND
========================= */
.brand{
    position:relative;
    z-index:2;

    font-size:35px;

    font-weight:800;

    letter-spacing:-1px;

    margin:0;

    color:#ffffff;

    text-shadow:
        0 5px 20px rgba(0,0,0,.30);

    animation:
        fadeUp .8s ease .15s both;
}

/* =========================
   TAGLINE
========================= */
.tagline{
    position:relative;
    z-index:2;

    margin:10px 0 0;

    color:rgba(255,255,255,.76);

    font-size:14px;

    line-height:1.5;

    letter-spacing:.2px;

    animation:
        fadeUp .8s ease .3s both;
}

/* =========================
   LOADER
========================= */
.loader{
    position:relative;
    z-index:2;

    width:50px;
    height:50px;

    margin-top:42px;

    border-radius:50%;

    border:
        4px solid
        rgba(255,255,255,.16);

    border-top-color:#ffffff;

    border-right-color:#60a5fa;

    animation:
        spin .8s linear infinite,
        fadeUp .8s ease .45s both;
}

/* center dot */
.loader::after{
    content:"";

    position:absolute;

    width:8px;
    height:8px;

    background:#ffffff;

    border-radius:50%;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    box-shadow:
        0 0 12px rgba(255,255,255,.8);
}

/* =========================
   LOADING TEXT
========================= */
.loading-text{
    position:relative;
    z-index:2;

    margin-top:17px;

    font-size:13px;

    color:rgba(255,255,255,.70);

    letter-spacing:.3px;

    animation:
        fadeUp .8s ease .55s both;
}

/* dots */
.dots span{
    animation:blink 1.2s infinite;
}

.dots span:nth-child(2){
    animation-delay:.2s;
}

.dots span:nth-child(3){
    animation-delay:.4s;
}

/* =========================
   PROGRESS BAR
========================= */
.progress{
    position:relative;
    z-index:2;

    width:190px;
    height:4px;

    margin-top:20px;

    border-radius:10px;

    background:
        rgba(255,255,255,.13);

    overflow:hidden;

    animation:
        fadeUp .8s ease .65s both;
}

.progress::before{
    content:"";

    position:absolute;

    top:0;
    left:-40%;

    width:40%;
    height:100%;

    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            #60a5fa,
            #ffffff,
            #60a5fa
        );

    animation:
        progressMove 1.3s ease-in-out infinite;
}

/* =========================
   FOOTER
========================= */
.footer{
    position:absolute;

    bottom:25px;

    color:rgba(255,255,255,.42);

    font-size:11px;

    letter-spacing:.4px;

    z-index:2;

    animation:
        fadeUp .8s ease .7s both;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

@keyframes logoFloat{

    0%,
    100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }

}

@keyframes logoAppear{

    from{
        opacity:0;
        transform:scale(.75);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@keyframes glowPulse{

    0%,
    100%{
        transform:
            translateX(-50%)
            scale(1);

        opacity:.7;
    }

    50%{
        transform:
            translateX(-50%)
            scale(1.12);

        opacity:1;
    }

}

@keyframes progressMove{

    0%{
        left:-40%;
    }

    100%{
        left:110%;
    }

}

@keyframes blink{

    0%,
    60%,
    100%{
        opacity:.2;
    }

    30%{
        opacity:1;
    }

}

/* =========================
   MOBILE
========================= */
@media(max-width:380px){

    .logo{
        width:100px;
        height:100px;
        border-radius:29px;
    }

    .brand{
        font-size:30px;
    }

    .tagline{
        font-size:13px;
    }

    .loader{
        margin-top:35px;
    }

}

/* =========================
   REDUCE MOTION
========================= */
@media(prefers-reduced-motion:reduce){

    .loader,
    .logo,
    .glow,
    .brand,
    .tagline,
    .loading-text,
    .progress,
    .footer{
        animation:none;
    }

}

</style>
</head>

<body>

<div class="splash">

    <div class="glow"></div>

    <!-- LOGO -->
    <div class="logo" aria-label="ChurchNotes logo">
        <div class="cross"></div>
    </div>

    <!-- TITLE -->
    <h1 class="brand">
        ChurchNotes
    </h1>

    <!-- TAGLINE -->
    <p class="tagline">
        Your faith. Your notes. Your journey.
    </p>

    <!-- LOADING SPINNER -->
    <div class="loader" aria-hidden="true"></div>

    <!-- LOADING TEXT -->
    <div class="loading-text">
        Loading ChurchNotes
        <span class="dots">
            <span>.</span>
            <span>.</span>
            <span>.</span>
        </span>
    </div>

    <!-- PROGRESS -->
    <div class="progress"></div>

    <!-- FOOTER -->
    <div class="footer">
        Please wait
    </div>

</div>

<script>

setTimeout(function(){

    window.location.replace("home.html");

},1800);

</script>

</body>
</html>
