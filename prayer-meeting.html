<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>ChurchNotes - Prayer Meeting</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5f9;
            color: #111827;
        }

        .mobile-app {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            margin: 0 auto;
            background: #f8fafc;
        }

        /* ==========================================
           HEADER
        ========================================== */

        .prayer-header {
            background: linear-gradient(
                135deg,
                #2563eb,
                #1d4ed8
            );

            color: white;
            padding: 20px 18px 24px;
        }

        .prayer-top {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .prayer-back {
            width: 40px;
            height: 40px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            text-decoration: none;

            font-size: 30px;

            background: rgba(255,255,255,0.15);

            flex-shrink: 0;
        }

        .prayer-title-area {
            flex: 1;
        }

        .prayer-title-area h1 {
            margin: 0;
            font-size: 24px;
        }

        .prayer-title-area p {
            margin: 4px 0 0;
            font-size: 13px;
            opacity: 0.85;
        }


        /* ==========================================
           CONTENT
        ========================================== */

        .prayer-content {
            padding: 20px 16px 40px;
        }


        /* ==========================================
           FORM CARD
        ========================================== */

        .prayer-form-card,
        .prayer-tabs-card {
            background: #ffffff;

            border-radius: 18px;

            padding: 18px;

            margin-bottom: 18px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.06);
        }


        .prayer-form-group {
            margin-bottom: 16px;
        }

        .prayer-form-group:last-child {
            margin-bottom: 0;
        }

        .prayer-form-group label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: 600;

            color: #1f2937;
        }

        .prayer-form-group input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #dbe1ea;

            border-radius: 11px;

            font-size: 14px;

            outline: none;

            background: #f9fafb;

            color: #111827;
        }

        .prayer-form-group input:focus {
            border-color: #2563eb;
            background: #ffffff;
        }


        /* ==========================================
           TABS
        ========================================== */

        .prayer-tabs {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 6px;

            background: #f1f5f9;

            padding: 5px;

            border-radius: 12px;

            margin-bottom: 18px;
        }

        .prayer-tab {
            border: none;

            background: transparent;

            padding: 11px 5px;

            border-radius: 9px;

            font-size: 12px;

            font-weight: 600;

            color: #64748b;

            cursor: pointer;
        }

        .prayer-tab.active {
            background: #ffffff;

            color: #2563eb;

            box-shadow:
                0 2px 7px rgba(0,0,0,0.08);
        }


        /* ==========================================
           PANELS
        ========================================== */

        .prayer-panel {
            display: none;
        }

        .prayer-panel.active {
            display: block;
        }

        .prayer-panel label {
            display: block;

            font-size: 15px;

            font-weight: 700;

            color: #1f2937;

            margin-bottom: 9px;
        }

        .prayer-panel textarea {
            width: 100%;

            min-height: 230px;

            resize: vertical;

            border: 1px solid #dbe1ea;

            border-radius: 12px;

            padding: 14px;

            font-family: inherit;

            font-size: 14px;

            line-height: 1.6;

            outline: none;

            background: #f9fafb;

            color: #111827;
        }

        .prayer-panel textarea:focus {
            border-color: #2563eb;
            background: #ffffff;
        }


        /* ==========================================
           SAVE BUTTON
        ========================================== */

        .save-prayer-btn {
            width: 100%;

            margin-top: 18px;

            border: none;

            border-radius: 12px;

            padding: 14px;

            background: linear-gradient(
                135deg,
                #2563eb,
                #1d4ed8
            );

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;
        }

        .save-prayer-btn:active {
            transform: scale(0.98);
        }


        /* ==========================================
           MESSAGE
        ========================================== */

        .prayer-message {
            display: none;

            margin-top: 12px;

            padding: 12px;

            border-radius: 10px;

            text-align: center;

            font-size: 13px;

            font-weight: 600;
        }

        .prayer-message.error {
            display: block;

            background: #fee2e2;

            color: #b91c1c;
        }


        /* ==========================================
           DARK MODE
        ========================================== */

        body.dark-mode {
            background: #0f172a;
            color: #f8fafc;
        }

        body.dark-mode .mobile-app {
            background: #0f172a;
        }

        body.dark-mode .prayer-form-card,
        body.dark-mode .prayer-tabs-card {
            background: #1f2937;
        }

        body.dark-mode .prayer-form-group label,
        body.dark-mode .prayer-panel label {
            color: #f3f4f6;
        }

        body.dark-mode .prayer-form-group input,
        body.dark-mode .prayer-panel textarea {
            background: #111827;

            border-color: #374151;

            color: #f9fafb;
        }

        body.dark-mode .prayer-form-group input:focus,
        body.dark-mode .prayer-panel textarea:focus {
            background: #111827;
        }

        body.dark-mode .prayer-tabs {
            background: #111827;
        }

        body.dark-mode .prayer-tab {
            color: #9ca3af;
        }

        body.dark-mode .prayer-tab.active {
            background: #374151;
            color: #60a5fa;
        }

    </style>


<style id="churchNotesPrayerMeetingDarkModePatch">
/* ==========================================
   CHURCHNOTES - PRAYER MEETING DARK MODE
   Synced with Settings using:
   localStorage key = churchNotesDarkMode
========================================== */

html.dark-mode,
html.dark-mode body {
    background: #0f172a !important;
}

html.dark-mode .mobile-app {
    background: #0f172a !important;
    color: #f8fafc !important;
}

html.dark-mode .prayer-content {
    background: #0f172a !important;
}

html.dark-mode .prayer-form-card,
html.dark-mode .prayer-tabs-card {
    background: #1e293b !important;
    color: #f8fafc !important;
    border-color: #334155 !important;
    box-shadow: 0 4px 15px rgba(0,0,0,.30) !important;
}

html.dark-mode .prayer-form-group label,
html.dark-mode .prayer-panel label {
    color: #f8fafc !important;
}

html.dark-mode .prayer-form-group input,
html.dark-mode .prayer-panel textarea {
    background: #0f172a !important;
    color: #f8fafc !important;
    border-color: #475569 !important;
    caret-color: #f8fafc;
}

html.dark-mode .prayer-form-group input::placeholder,
html.dark-mode .prayer-panel textarea::placeholder {
    color: #94a3b8 !important;
}

html.dark-mode .prayer-form-group input:focus,
html.dark-mode .prayer-panel textarea:focus {
    background: #111827 !important;
    border-color: #60a5fa !important;
}

html.dark-mode .prayer-tabs {
    background: #0f172a !important;
}

html.dark-mode .prayer-tab {
    color: #94a3b8 !important;
}

html.dark-mode .prayer-tab.active {
    background: #334155 !important;
    color: #60a5fa !important;
}

html.dark-mode .prayer-message.error {
    background: #450a0a !important;
    color: #fca5a5 !important;
}

html.dark-mode .prayer-back {
    color: #ffffff !important;
}

html.dark-mode .save-prayer-btn {
    color: #ffffff !important;
}
</style>

</head>


<body>


<div class="mobile-app">


    <!-- ==========================================
         HEADER
    ========================================== -->

    <header class="prayer-header">

        <div class="prayer-top">

            <a
                href="notes.html"
                class="prayer-back"
                aria-label="Back"
            >
                ‹
            </a>


            <div class="prayer-title-area">

                <h1>
                    Prayer Meeting
                </h1>

                <p>
                    Record your prayer meeting
                </p>

            </div>

        </div>

    </header>



    <!-- ==========================================
         CONTENT
    ========================================== -->

    <main class="prayer-content">


        <!-- ======================================
             MEETING INFORMATION
        ======================================= -->

        <section class="prayer-form-card">


            <!-- DATE -->

            <div class="prayer-form-group">

                <label for="prayerDate">
                    Date
                </label>

                <input
                    type="date"
                    id="prayerDate"
                >

            </div>


            <!-- PRAYER LEADER -->

            <div class="prayer-form-group">

                <label for="prayerLeader">
                    Speaker / Prayer Leader
                </label>

                <input
                    type="text"
                    id="prayerLeader"
                    placeholder="Enter speaker or prayer leader"
                >

            </div>


            <!-- TOPIC -->

            <div class="prayer-form-group">

                <label for="prayerTopic">
                    Prayer Meeting Topic
                </label>

                <input
                    type="text"
                    id="prayerTopic"
                    placeholder="Enter prayer meeting topic"
                >

            </div>


            <!-- SCRIPTURE -->

            <div class="prayer-form-group">

                <label for="prayerScripture">
                    Scripture Reference
                </label>

                <input
                    type="text"
                    id="prayerScripture"
                    placeholder="Example: Philippians 4:6"
                >

            </div>


        </section>



        <!-- ======================================
             NOTES / REQUESTS / ANSWERED
        ======================================= -->

        <section class="prayer-tabs-card">


            <!-- TABS -->

            <div class="prayer-tabs">

                <button
                    type="button"
                    class="prayer-tab active"
                    data-tab="notes"
                >
                    📝 Notes
                </button>


                <button
                    type="button"
                    class="prayer-tab"
                    data-tab="requests"
                >
                    🙏 Requests
                </button>


                <button
                    type="button"
                    class="prayer-tab"
                    data-tab="answered"
                >
                    ❤️ Answered
                </button>

            </div>



            <!-- NOTES -->

            <div
                class="prayer-panel active"
                id="panel-notes"
            >

                <label for="prayerNotes">
                    Prayer Meeting Notes
                </label>

                <textarea
                    id="prayerNotes"
                    placeholder="Write your prayer meeting notes here..."
                ></textarea>

            </div>



            <!-- REQUESTS -->

            <div
                class="prayer-panel"
                id="panel-requests"
            >

                <label for="prayerRequests">
                    Prayer Requests
                </label>

                <textarea
                    id="prayerRequests"
                    placeholder="Write the prayer requests here..."
                ></textarea>

            </div>



            <!-- ANSWERED -->

            <div
                class="prayer-panel"
                id="panel-answered"
            >

                <label for="answeredPrayers">
                    Answered Prayers
                </label>

                <textarea
                    id="answeredPrayers"
                    placeholder="Write answered prayers or testimonies here..."
                ></textarea>

            </div>



            <!-- ERROR MESSAGE -->

            <div
                id="prayerMessage"
                class="prayer-message"
            ></div>



            <!-- SAVE -->

            <button
                type="button"
                class="save-prayer-btn"
                id="savePrayerBtn"
            >
                💾 Save Note
            </button>


        </section>


    </main>


</div>



<!-- ==========================================
     SHARED APP JS
========================================== -->

<script src="js/app.js"></script>


<script id="churchNotesPrayerMeetingDarkModeSync">
(function () {
    const DARK_MODE_KEY = "churchNotesDarkMode";

    function syncPrayerMeetingDarkMode() {
        const enabled = localStorage.getItem(DARK_MODE_KEY) === "true";

        document.documentElement.classList.toggle("dark-mode", enabled);

        if (document.body) {
            document.body.classList.toggle("dark-mode", enabled);
        }
    }

    syncPrayerMeetingDarkMode();

    document.addEventListener("DOMContentLoaded", syncPrayerMeetingDarkMode);
    window.addEventListener("pageshow", syncPrayerMeetingDarkMode);

    window.addEventListener("storage", function (event) {
        if (event.key === DARK_MODE_KEY) {
            syncPrayerMeetingDarkMode();
        }
    });
})();
</script>



<!-- ==========================================
     PRAYER MEETING JS
========================================== -->

<script>

(function () {

    "use strict";


    document.addEventListener(
        "DOMContentLoaded",
        function () {


            /* ======================================
               GET ELEMENTS
            ====================================== */

            const dateInput =
                document.getElementById(
                    "prayerDate"
                );

            const leaderInput =
                document.getElementById(
                    "prayerLeader"
                );

            const topicInput =
                document.getElementById(
                    "prayerTopic"
                );

            const scriptureInput =
                document.getElementById(
                    "prayerScripture"
                );

            const notesInput =
                document.getElementById(
                    "prayerNotes"
                );

            const requestsInput =
                document.getElementById(
                    "prayerRequests"
                );

            const answeredInput =
                document.getElementById(
                    "answeredPrayers"
                );

            const saveButton =
                document.getElementById(
                    "savePrayerBtn"
                );

            const message =
                document.getElementById(
                    "prayerMessage"
                );



            /* ======================================
               SET TODAY'S DATE
            ====================================== */

            if (dateInput && !dateInput.value) {

                const today =
                    new Date();

                const year =
                    today.getFullYear();

                const month =
                    String(
                        today.getMonth() + 1
                    ).padStart(2, "0");

                const day =
                    String(
                        today.getDate()
                    ).padStart(2, "0");

                dateInput.value =
                    year + "-" +
                    month + "-" +
                    day;

            }



            /* ======================================
               TABS
            ====================================== */

            const tabs =
                document.querySelectorAll(
                    ".prayer-tab"
                );

            const panels =
                document.querySelectorAll(
                    ".prayer-panel"
                );


            tabs.forEach(function (tab) {

                tab.addEventListener(
                    "click",
                    function () {

                        const target =
                            this.getAttribute(
                                "data-tab"
                            );


                        tabs.forEach(
                            function (item) {

                                item.classList.remove(
                                    "active"
                                );

                            }
                        );


                        panels.forEach(
                            function (panel) {

                                panel.classList.remove(
                                    "active"
                                );

                            }
                        );


                        this.classList.add(
                            "active"
                        );


                        const targetPanel =
                            document.getElementById(
                                "panel-" + target
                            );


                        if (targetPanel) {

                            targetPanel.classList.add(
                                "active"
                            );

                        }

                    }
                );

            });



            /* ======================================
               SAVE NOTE
            ====================================== */

            if (!saveButton) {

                console.error(
                    "Prayer Meeting: Save button not found."
                );

                return;

            }


            saveButton.addEventListener(
                "click",
                function () {


                    const date =
                        dateInput
                            ? dateInput.value
                            : "";


                    const leader =
                        leaderInput
                            ? leaderInput.value.trim()
                            : "";


                    const topic =
                        topicInput
                            ? topicInput.value.trim()
                            : "";


                    const scripture =
                        scriptureInput
                            ? scriptureInput.value.trim()
                            : "";


                    const notes =
                        notesInput
                            ? notesInput.value.trim()
                            : "";


                    const requests =
                        requestsInput
                            ? requestsInput.value.trim()
                            : "";


                    const answered =
                        answeredInput
                            ? answeredInput.value.trim()
                            : "";



                    /* ==================================
                       VALIDATION
                    ================================== */

                    if (!date) {

                        showPrayerError(
                            "Please select the date."
                        );

                        return;

                    }


                    if (!topic) {

                        showPrayerError(
                            "Please enter the prayer meeting topic."
                        );

                        if (topicInput) {
                            topicInput.focus();
                        }

                        return;

                    }


                    /* ==================================
                       CREATE NOTE
                    ================================== */

                    const prayerNote = {

                        id: Date.now(),

                        type:
                            "Prayer Meeting",

                        date:
                            date,

                        speaker:
                            leader,

                        sermonTitle:
                            topic,

                        scripture:
                            scripture,

                        notes:
                            notes,

                        actions:
                            requests,

                        prayer:
                            answered,

                        createdAt:
                            new Date().toISOString()

                    };



                    /* ==================================
                       GET EXISTING NOTES
                    ================================== */

                    let savedNotes = [];


                    try {

                        const existingNotes =
                            localStorage.getItem(
                                "churchNotes"
                            );


                        if (existingNotes) {

                            savedNotes =
                                JSON.parse(
                                    existingNotes
                                );

                        }


                        if (
                            !Array.isArray(
                                savedNotes
                            )
                        ) {

                            savedNotes = [];

                        }

                    }

                    catch (error) {

                        console.error(
                            "Error reading churchNotes:",
                            error
                        );

                        savedNotes = [];

                    }



                    /* ==================================
                       ADD NEW NOTE FIRST
                    ================================== */

                    savedNotes.unshift(
                        prayerNote
                    );



                    /* ==================================
                       SAVE
                    ================================== */

                    try {

                        localStorage.setItem(
                            "churchNotes",
                            JSON.stringify(
                                savedNotes
                            )
                        );

                    }

                    catch (error) {

                        console.error(
                            "Error saving churchNotes:",
                            error
                        );

                        showPrayerError(
                            "Unable to save the note. Please try again."
                        );

                        return;

                    }



                    /* ==================================
                       SUCCESS
                    ================================== */

                    alert(
                        "Prayer Meeting note saved successfully! 🙏"
                    );


                    window.location.href =
                        "notes.html";

                }
            );


        }
    );


    /* ==========================================
       ERROR MESSAGE
    ========================================== */

    function showPrayerError(text) {

        const message =
            document.getElementById(
                "prayerMessage"
            );


        if (!message) {

            alert(text);

            return;

        }


        message.textContent =
            text;

        message.className =
            "prayer-message error";


        setTimeout(
            function () {

                message.className =
                    "prayer-message";

                message.textContent =
                    "";

            },
            3000
        );

    }


})();

</script>


</body>

</html>
