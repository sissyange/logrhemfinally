<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ChurchNotes - Custom Service</title>
<link rel="stylesheet" href="css/style.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef2f7;color:#172033}
body.dark-mode{background:#0f172a;color:#e5e7eb}
.custom-app{width:100%;max-width:430px;min-height:100vh;margin:0 auto;background:#fff;padding-bottom:90px}
body.dark-mode .custom-app{background:#0f172a}
.custom-header{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;padding:22px 18px 26px;border-radius:0 0 28px 28px}
.custom-header-top{display:flex;align-items:center;gap:12px}
.back-btn{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:25px;cursor:pointer}
.custom-header h1{font-size:22px;margin:0;line-height:1.2}
.custom-header p{margin:5px 0 0;opacity:.9;font-size:13px}
.custom-content{padding:18px}
.form-card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 20px rgba(15,23,42,.08)}
body.dark-mode .form-card{background:#1e293b;box-shadow:none}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
.form-group input,.form-group textarea{width:100%;border:1px solid #dbe3ee;border-radius:12px;padding:12px 13px;font-size:14px;background:#f8fafc;color:#172033;outline:none;font-family:inherit}
.form-group textarea{min-height:130px;resize:vertical;line-height:1.5}
body.dark-mode .form-group input,body.dark-mode .form-group textarea{background:#0f172a;border-color:#334155;color:#e5e7eb}
.form-group input:focus,.form-group textarea:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.10)}
.date-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.section-title{font-size:14px;font-weight:800;margin:20px 0 10px}
.tab-buttons{display:flex;gap:8px;margin-bottom:12px;overflow:auto}
.tab-btn{border:0;background:#eef2f7;color:#475569;padding:9px 13px;border-radius:999px;font-weight:700;white-space:nowrap;cursor:pointer}
.tab-btn.active{background:#2563eb;color:#fff}
body.dark-mode .tab-btn{background:#334155;color:#cbd5e1}
body.dark-mode .tab-btn.active{background:#2563eb;color:#fff}
.tab-panel{display:none}.tab-panel.active{display:block}
.save-btn{width:100%;border:0;border-radius:14px;padding:14px;background:#2563eb;color:#fff;font-size:15px;font-weight:800;cursor:pointer;margin-top:8px}
.save-btn:active{transform:scale(.98)}
.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;display:flex;background:#fff;border-top:1px solid #e2e8f0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:20}
body.dark-mode .bottom-nav{background:#111827;border-color:#334155}
.bottom-nav .nav-item{flex:1;text-align:center;text-decoration:none;color:#64748b;font-size:20px;padding:4px}.bottom-nav .nav-item small{display:block;font-size:11px;margin-top:2px}.bottom-nav .nav-item.active{color:#2563eb}
body.dark-mode .bottom-nav .nav-item{color:#94a3b8}body.dark-mode .bottom-nav .nav-item.active{color:#60a5fa}
.message{display:none;background:#fef2f2;color:#b91c1c;border-radius:12px;padding:11px;margin-bottom:14px;font-size:13px}
@media(min-width:431px){body{background:#dbe4f0}}
</style>
</head>
<body>
<div class="custom-app">
<header class="custom-header">
  <div class="custom-header-top">
    <button class="back-btn" id="backBtn" type="button">‹</button>
    <div>
      <h1 id="serviceTitle">Custom Service</h1>
      <p>ChurchNotes • Add your service notes</p>
    </div>
  </div>
</header>

<main class="custom-content">
  <div class="message" id="errorMessage"></div>
  <div class="form-card">
    <div class="date-row">
      <div class="form-group">
        <label for="noteDate">Date</label>
        <input type="date" id="noteDate">
      </div>
      <div class="form-group">
        <label for="speaker">Speaker / Leader</label>
        <input type="text" id="speaker" placeholder="Enter name">
      </div>
    </div>

    <div class="form-group">
      <label for="topic">Service Topic</label>
      <input type="text" id="topic" placeholder="Enter topic">
    </div>

    <div class="form-group">
      <label for="scripture">Scripture Reference</label>
      <input type="text" id="scripture" placeholder="e.g. John 3:16">
    </div>

    <div class="section-title">Service Notes</div>
    <div class="tab-buttons">
      <button class="tab-btn active" data-tab="notes" type="button">📝 Notes</button>
      <button class="tab-btn" data-tab="lessons" type="button">💡 Lessons</button>
      <button class="tab-btn" data-tab="application" type="button">🎯 Application</button>
    </div>

    <div class="tab-panel active" id="panel-notes">
      <div class="form-group"><textarea id="notes" placeholder="Write your notes here..."></textarea></div>
    </div>
    <div class="tab-panel" id="panel-lessons">
      <div class="form-group"><textarea id="lessons" placeholder="Write the lessons or key points..."></textarea></div>
    </div>
    <div class="tab-panel" id="panel-application">
      <div class="form-group"><textarea id="application" placeholder="Write your application or action steps..."></textarea></div>
    </div>

    <button class="save-btn" id="saveNote" type="button">Save Note</button>
  </div>
</main>

<nav class="bottom-nav">
  <a href="home.html" class="nav-item"><span>⌂</span><small>Home</small></a>
  <a href="notes.html" class="nav-item"><span>📝</span><small>Notes</small></a>
  <a href="schedule.html" class="nav-item"><span>📅</span><small>Schedule</small></a>
  <a href="settings.html" class="nav-item"><span>⚙️</span><small>Settings</small></a>
</nav>
</div>

<script>
(function(){
  const params=new URLSearchParams(window.location.search);
  const serviceName=(params.get("service")||"Custom Service").trim()||"Custom Service";
  document.getElementById("serviceTitle").textContent=serviceName;

  const dateInput=document.getElementById("noteDate");
  const today=new Date();
  const localDate=new Date(today.getTime()-today.getTimezoneOffset()*60000).toISOString().slice(0,10);
  dateInput.value=localDate;

  document.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("panel-"+btn.dataset.tab).classList.add("active");
    });
  });

  document.getElementById("backBtn").addEventListener("click",()=>history.length>1?history.back():location.href="home.html");

  document.getElementById("saveNote").addEventListener("click",()=>{
    const date=dateInput.value;
    const speaker=document.getElementById("speaker").value.trim();
    const topic=document.getElementById("topic").value.trim();
    const scripture=document.getElementById("scripture").value.trim();
    const notes=document.getElementById("notes").value.trim();
    const lessons=document.getElementById("lessons").value.trim();
    const application=document.getElementById("application").value.trim();
    const error=document.getElementById("errorMessage");

    if(!date||!topic){
      error.textContent="Please enter the date and service topic.";
      error.style.display="block";
      return;
    }
    error.style.display="none";

    let saved=[];
    try{saved=JSON.parse(localStorage.getItem("churchNotes")||"[]");if(!Array.isArray(saved))saved=[];}catch(e){saved=[];}

    saved.unshift({
      id:Date.now(),
      type:serviceName,
      date:date,
      speaker:speaker,
      sermonTitle:topic,
      scripture:scripture,
      notes:notes,
      actions:lessons,
      prayer:application,
      createdAt:new Date().toISOString()
    });

    localStorage.setItem("churchNotes",JSON.stringify(saved));
    window.location.href="notes.html";
  });

  const savedMode=localStorage.getItem("churchNotesDarkMode");
  if(savedMode==="true")document.body.classList.add("dark-mode");
})();
</script>
</body>
</html>
