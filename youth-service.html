<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>ChurchNotes - Youth Service</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5f9;
            color: #111827;
        }

        .mobile-app {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            margin: 0 auto;
            background: #f8fafc;
        }


        /* ==========================================
           HEADER
        ========================================== */

        .youth-header {
            background: linear-gradient(
                135deg,
                #2563eb,
                #1d4ed8
            );

            color: white;

            padding: 20px 18px 24px;
        }

        .youth-top {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .youth-back {
            width: 40px;
            height: 40px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            text-decoration: none;

            font-size: 30px;

            background:
                rgba(255,255,255,0.15);

            flex-shrink: 0;
        }

        .youth-title-area {
            flex: 1;
        }

        .youth-title-area h1 {
            margin: 0;
            font-size: 24px;
        }

        .youth-title-area p {
            margin: 4px 0 0;

            font-size: 13px;

            opacity: 0.85;
        }


        /* ==========================================
           CONTENT
        ========================================== */

        .youth-content {
            padding: 20px 16px 40px;
        }


        /* ==========================================
           FORM CARD
        ========================================== */

        .youth-form-card,
        .youth-tabs-card {

            background: #ffffff;

            border-radius: 18px;

            padding: 18px;

            margin-bottom: 18px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.06);
        }


        .youth-form-group {
            margin-bottom: 16px;
        }

        .youth-form-group:last-child {
            margin-bottom: 0;
        }


        .youth-form-group label {

            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: 600;

            color: #1f2937;
        }


        .youth-form-group input {

            width: 100%;

            padding: 13px 14px;

            border:
                1px solid #dbe1ea;

            border-radius: 11px;

            font-size: 14px;

            outline: none;

            background: #f9fafb;

            color: #111827;
        }


        .youth-form-group input:focus {

            border-color: #2563eb;

            background: #ffffff;
        }


        /* ==========================================
           TABS
        ========================================== */

        .youth-tabs {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 6px;

            background: #f1f5f9;

            padding: 5px;

            border-radius: 12px;

            margin-bottom: 18px;
        }


        .youth-tab {

            border: none;

            background: transparent;

            padding: 11px 5px;

            border-radius: 9px;

            font-size: 12px;

            font-weight: 600;

            color: #64748b;

            cursor: pointer;
        }


        .youth-tab.active {

            background: #ffffff;

            color: #2563eb;

            box-shadow:
                0 2px 7px rgba(0,0,0,0.08);
        }


        /* ==========================================
           PANELS
        ========================================== */

        .youth-panel {
            display: none;
        }

        .youth-panel.active {
            display: block;
        }


        .youth-panel label {

            display: block;

            font-size: 15px;

            font-weight: 700;

            color: #1f2937;

            margin-bottom: 9px;
        }


        .youth-panel textarea {

            width: 100%;

            min-height: 230px;

            resize: vertical;

            border:
                1px solid #dbe1ea;

            border-radius: 12px;

            padding: 14px;

            font-family: inherit;

            font-size: 14px;

            line-height: 1.6;

            outline: none;

            background: #f9fafb;

            color: #111827;
        }


        .youth-panel textarea:focus {

            border-color: #2563eb;

            background: #ffffff;
        }


        /* ==========================================
           SAVE BUTTON
        ========================================== */

        .save-youth-btn {

            width: 100%;

            margin-top: 18px;

            border: none;

            border-radius: 12px;

            padding: 14px;

            background: linear-gradient(
                135deg,
                #2563eb,
                #1d4ed8
            );

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;
        }


        .save-youth-btn:active {
            transform: scale(0.98);
        }


        /* ==========================================
           ERROR MESSAGE
        ========================================== */

        .youth-message {

            display: none;

            margin-top: 12px;

            padding: 12px;

            border-radius: 10px;

            text-align: center;

            font-size: 13px;

            font-weight: 600;
        }


        .youth-message.error {

            display: block;

            background: #fee2e2;

            color: #b91c1c;
        }


        /* ==========================================
           DARK MODE
        ========================================== */

        body.dark-mode {

            background: #0f172a;

            color: #f8fafc;
        }


        body.dark-mode .mobile-app {

            background: #0f172a;
        }


        body.dark-mode .youth-form-card,
        body.dark-mode .youth-tabs-card {

            background: #1f2937;
        }


        body.dark-mode .youth-form-group label,
        body.dark-mode .youth-panel label {

            color: #f3f4f6;
        }


        body.dark-mode .youth-form-group input,
        body.dark-mode .youth-panel textarea {

            background: #111827;

            border-color: #374151;

            color: #f9fafb;
        }


        body.dark-mode .youth-tabs {

            background: #111827;
        }


        body.dark-mode .youth-tab {

            color: #9ca3af;
        }


        body.dark-mode .youth-tab.active {

            background: #374151;

            color: #60a5fa;
        }

    </style>


<style id="churchNotesYouthServiceDarkModePatch">
/* ==========================================
   CHURCHNOTES - YOUTH SERVICE DARK MODE
   Synced with Settings using:
   localStorage key = churchNotesDarkMode
========================================== */

html.dark-mode,
html.dark-mode body {
    background: #0f172a !important;
}

html.dark-mode .mobile-app {
    background: #0f172a !important;
    color: #f8fafc !important;
}

html.dark-mode .youth-content {
    background: #0f172a !important;
}

html.dark-mode .youth-form-card,
html.dark-mode .youth-tabs-card {
    background: #1e293b !important;
    color: #f8fafc !important;
    border-color: #334155 !important;
    box-shadow: 0 4px 15px rgba(0,0,0,.30) !important;
}

html.dark-mode .youth-form-group label,
html.dark-mode .youth-panel label {
    color: #f8fafc !important;
}

html.dark-mode .youth-form-group input,
html.dark-mode .youth-panel textarea {
    background: #0f172a !important;
    color: #f8fafc !important;
    border-color: #475569 !important;
    caret-color: #f8fafc;
}

html.dark-mode .youth-form-group input::placeholder,
html.dark-mode .youth-panel textarea::placeholder {
    color: #94a3b8 !important;
}

html.dark-mode .youth-form-group input:focus,
html.dark-mode .youth-panel textarea:focus {
    background: #111827 !important;
    border-color: #60a5fa !important;
}

html.dark-mode .youth-tabs {
    background: #0f172a !important;
}

html.dark-mode .youth-tab {
    color: #94a3b8 !important;
}

html.dark-mode .youth-tab.active {
    background: #334155 !important;
    color: #60a5fa !important;
}

html.dark-mode .youth-message.error {
    background: #450a0a !important;
    color: #fca5a5 !important;
}

html.dark-mode .youth-back,
html.dark-mode .save-youth-btn {
    color: #ffffff !important;
}
</style>

</head>


<body>


<div class="mobile-app">


    <!-- ==========================================
         HEADER
    ========================================== -->

    <header class="youth-header">

        <div class="youth-top">

            <a
                href="notes.html"
                class="youth-back"
                aria-label="Back"
            >
                ‹
            </a>


            <div class="youth-title-area">

                <h1>
                    Youth Service
                </h1>

                <p>
                    Record your youth service
                </p>

            </div>

        </div>

    </header>



    <!-- ==========================================
         CONTENT
    ========================================== -->

    <main class="youth-content">


        <!-- ======================================
             SERVICE INFORMATION
        ======================================= -->

        <section class="youth-form-card">


            <!-- DATE -->

            <div class="youth-form-group">

                <label for="youthDate">
                    Date
                </label>

                <input
                    type="date"
                    id="youthDate"
                >

            </div>


            <!-- YOUTH LEADER -->

            <div class="youth-form-group">

                <label for="youthLeader">
                    Speaker / Youth Leader
                </label>

                <input
                    type="text"
                    id="youthLeader"
                    placeholder="Enter speaker or youth leader"
                >

            </div>


            <!-- TOPIC -->

            <div class="youth-form-group">

                <label for="youthTopic">
                    Youth Service Topic
                </label>

                <input
                    type="text"
                    id="youthTopic"
                    placeholder="Enter youth service topic"
                >

            </div>


            <!-- SCRIPTURE -->

            <div class="youth-form-group">

                <label for="youthScripture">
                    Scripture Reference
                </label>

                <input
                    type="text"
                    id="youthScripture"
                    placeholder="Example: 1 Timothy 4:12"
                >

            </div>


        </section>



        <!-- ======================================
             NOTES / LESSONS / PRAYER
        ======================================= -->

        <section class="youth-tabs-card">


            <div class="youth-tabs">


                <button
                    type="button"
                    class="youth-tab active"
                    data-tab="notes"
                >
                    📝 Notes
                </button>


                <button
                    type="button"
                    class="youth-tab"
                    data-tab="lessons"
                >
                    💡 Lessons
                </button>


                <button
                    type="button"
                    class="youth-tab"
                    data-tab="prayer"
                >
                    🙏 Prayer
                </button>


            </div>



            <!-- NOTES -->

            <div
                class="youth-panel active"
                id="panel-notes"
            >

                <label for="youthNotes">
                    Youth Service Notes
                </label>

                <textarea
                    id="youthNotes"
                    placeholder="Write your youth service notes here..."
                ></textarea>

            </div>



            <!-- LESSONS -->

            <div
                class="youth-panel"
                id="panel-lessons"
            >

                <label for="youthLessons">
                    Key Lessons / Takeaways
                </label>

                <textarea
                    id="youthLessons"
                    placeholder="Write the important lessons and takeaways here..."
                ></textarea>

            </div>



            <!-- PRAYER -->

            <div
                class="youth-panel"
                id="panel-prayer"
            >

                <label for="youthPrayer">
                    Prayer
                </label>

                <textarea
                    id="youthPrayer"
                    placeholder="Write your prayer here..."
                ></textarea>

            </div>



            <!-- ERROR -->

            <div
                id="youthMessage"
                class="youth-message"
            ></div>



            <!-- SAVE -->

            <button
                type="button"
                class="save-youth-btn"
                id="saveYouthBtn"
            >
                💾 Save Note
            </button>


        </section>


    </main>


</div>



<!-- ==========================================
     SHARED APP JS
========================================== -->

<script src="
app.js"></script>


<script id="churchNotesYouthServiceDarkModeSync">
(function () {
    const DARK_MODE_KEY = "churchNotesDarkMode";

    function syncYouthServiceDarkMode() {
        const enabled = localStorage.getItem(DARK_MODE_KEY) === "true";

        document.documentElement.classList.toggle("dark-mode", enabled);

        if (document.body) {
            document.body.classList.toggle("dark-mode", enabled);
        }
    }

    syncYouthServiceDarkMode();

    document.addEventListener("DOMContentLoaded", syncYouthServiceDarkMode);
    window.addEventListener("pageshow", syncYouthServiceDarkMode);

    window.addEventListener("storage", function (event) {
        if (event.key === DARK_MODE_KEY) {
            syncYouthServiceDarkMode();
        }
    });
})();
</script>




<!-- ==========================================
     YOUTH SERVICE JS
========================================== -->

<script>

(function () {

    "use strict";


    document.addEventListener(
        "DOMContentLoaded",
        function () {


            /* ======================================
               ELEMENTS
            ====================================== */

            const dateInput =
                document.getElementById(
                    "youthDate"
                );

            const leaderInput =
                document.getElementById(
                    "youthLeader"
                );

            const topicInput =
                document.getElementById(
                    "youthTopic"
                );

            const scriptureInput =
                document.getElementById(
                    "youthScripture"
                );

            const notesInput =
                document.getElementById(
                    "youthNotes"
                );

            const lessonsInput =
                document.getElementById(
                    "youthLessons"
                );

            const prayerInput =
                document.getElementById(
                    "youthPrayer"
                );

            const saveButton =
                document.getElementById(
                    "saveYouthBtn"
                );



            /* ======================================
               TODAY
            ====================================== */

            if (
                dateInput &&
                !dateInput.value
            ) {

                const today =
                    new Date();

                const year =
                    today.getFullYear();

                const month =
                    String(
                        today.getMonth() + 1
                    ).padStart(2, "0");

                const day =
                    String(
                        today.getDate()
                    ).padStart(2, "0");

                dateInput.value =
                    year +
                    "-" +
                    month +
                    "-" +
                    day;

            }



            /* ======================================
               TABS
            ====================================== */

            const tabs =
                document.querySelectorAll(
                    ".youth-tab"
                );

            const panels =
                document.querySelectorAll(
                    ".youth-panel"
                );


            tabs.forEach(
                function (tab) {

                    tab.addEventListener(
                        "click",
                        function () {

                            const target =
                                this.getAttribute(
                                    "data-tab"
                                );


                            tabs.forEach(
                                function (item) {

                                    item.classList.remove(
                                        "active"
                                    );

                                }
                            );


                            panels.forEach(
                                function (panel) {

                                    panel.classList.remove(
                                        "active"
                                    );

                                }
                            );


                            this.classList.add(
                                "active"
                            );


                            const targetPanel =
                                document.getElementById(
                                    "panel-" +
                                    target
                                );


                            if (targetPanel) {

                                targetPanel.classList.add(
                                    "active"
                                );

                            }

                        }
                    );

                }
            );



            /* ======================================
               SAVE
            ====================================== */

            if (!saveButton) {

                return;

            }


            saveButton.addEventListener(
                "click",
                function () {


                    const date =
                        dateInput
                            ? dateInput.value
                            : "";


                    const leader =
                        leaderInput
                            ? leaderInput.value.trim()
                            : "";


                    const topic =
                        topicInput
                            ? topicInput.value.trim()
                            : "";


                    const scripture =
                        scriptureInput
                            ? scriptureInput.value.trim()
                            : "";


                    const notes =
                        notesInput
                            ? notesInput.value.trim()
                            : "";


                    const lessons =
                        lessonsInput
                            ? lessonsInput.value.trim()
                            : "";


                    const prayer =
                        prayerInput
                            ? prayerInput.value.trim()
                            : "";



                    /* ==================================
                       VALIDATION
                    ================================== */

                    if (!date) {

                        showYouthError(
                            "Please select the date."
                        );

                        return;

                    }


                    if (!topic) {

                        showYouthError(
                            "Please enter the youth service topic."
                        );

                        if (topicInput) {

                            topicInput.focus();

                        }

                        return;

                    }



                    /* ==================================
                       CREATE NOTE
                    ================================== */

                    const youthNote = {

                        id:
                            Date.now(),

                        type:
                            "Youth Service",

                        date:
                            date,

                        speaker:
                            leader,

                        sermonTitle:
                            topic,

                        scripture:
                            scripture,

                        notes:
                            notes,

                        actions:
                            lessons,

                        prayer:
                            prayer,

                        createdAt:
                            new Date().toISOString()

                    };



                    /* ==================================
                       GET SAVED NOTES
                    ================================== */

                    let savedNotes = [];


                    try {

                        const existingNotes =
                            localStorage.getItem(
                                "churchNotes"
                            );


                        if (existingNotes) {

                            savedNotes =
                                JSON.parse(
                                    existingNotes
                                );

                        }


                        if (
                            !Array.isArray(
                                savedNotes
                            )
                        ) {

                            savedNotes = [];

                        }

                    }

                    catch (error) {

                        console.error(
                            "Error reading notes:",
                            error
                        );

                        savedNotes = [];

                    }



                    /* ==================================
                       ADD NEW NOTE
                    ================================== */

                    savedNotes.unshift(
                        youthNote
                    );



                    /* ==================================
                       SAVE TO LOCAL STORAGE
                    ================================== */

                    try {

                        localStorage.setItem(
                            "churchNotes",
                            JSON.stringify(
                                savedNotes
                            )
                        );

                    }

                    catch (error) {

                        console.error(
                            "Error saving note:",
                            error
                        );

                        showYouthError(
                            "Unable to save the note. Please try again."
                        );

                        return;

                    }



                    /* ==================================
                       SUCCESS
                    ================================== */

                    alert(
                        "Youth Service note saved successfully! 👥"
                    );


                    window.location.href =
                        "notes.html";

                }
            );

        }
    );



    /* ==========================================
       ERROR
    ========================================== */

    function showYouthError(text) {

        const message =
            document.getElementById(
                "youthMessage"
            );


        if (!message) {

            alert(text);

            return;

        }


        message.textContent =
            text;

        message.className =
            "youth-message error";


        setTimeout(
            function () {

                message.textContent =
                    "";

                message.className =
                    "youth-message";

            },
            3000
        );

    }


})();

</script>


</body>

</html>
